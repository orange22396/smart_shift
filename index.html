  _renderShiftRows();
}

function deleteShiftRow(idx) {
  tempShifts.splice(idx, 1);
  _renderShiftRows();
}

function saveShiftsFromEditor() {
  for (const s of tempShifts) {
    if (!s.name.trim()) { showToast('請填寫所有班別名稱'); return; }
    if (!s.start || !s.end)  { showToast('請填寫完整時間'); return; }
  }
  storeConfig.shifts = tempShifts.map(s => ({ ...s, name: s.name.trim() }));
  saveConfig();
  closeModal('shiftsModal');
  showToast('✅ 班別設定已儲存');
}

// ─── Export JPG ──────────────────────────────────────────
function exportJpg() {
  showToast('⏳ 正在產生圖片…');
  const wrapper = document.getElementById('scheduleOuter');

  // 匯出前隱藏統計欄（員工不需要看到）
  const statEls = document.querySelectorAll('[data-stat]');
  statEls.forEach(el => { el.dataset.statPrev = el.style.display; el.style.display = 'none'; });

  // 插入年月標題
  const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  const exportHeader = document.createElement('div');
  exportHeader.id = 'exportHeader';
  exportHeader.style.cssText = 'padding:16px 40px 8px;font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:400;letter-spacing:2px;color:#1a1714;background:#ffffff;';
  exportHeader.textContent = `${curYear}  ${monthNames[curMonth-1]}`;
  wrapper.insertBefore(exportHeader, wrapper.firstChild);

  html2canvas(wrapper, {
    backgroundColor: '#1a1917',
    scale: 2,
    useCORS: true,
  }).then(canvas => {
    // 還原統計欄 & 移除標題
    statEls.forEach(el => { el.style.display = el.dataset.statPrev || ''; delete el.dataset.statPrev; });
    wrapper.removeChild(exportHeader);
    const link = document.createElement('a');
    link.download = `班表_${curYear}-${String(curMonth).padStart(2,'0')}.jpg`;
    link.href = canvas.toDataURL('image/jpeg', 0.92);
    link.click();
    showToast('✅ 已匯出 JPG');
  }).catch(() => {
    statEls.forEach(el => { el.style.display = el.dataset.statPrev || ''; delete el.dataset.statPrev; });
    if (document.getElementById('exportHeader')) wrapper.removeChild(exportHeader);
    showToast('⚠ 匯出失敗');
  });
}

// ─── Copy Debug Info ─────────────────────────────────────
function copyDebugInfo() {
  const emps = sortedEmployees();
  const days = getDaysInMonth(curYear, curMonth);

  // 把 schedule 轉成 {名字: {日期: 班別}} 方便閱讀
  const scheduleByName = {};
  emps.forEach((emp, empIdx) => {
    const entries = {};
    for (let d = 1; d <= days; d++) {
      const ds = dateStr(curYear, curMonth, d);
      const s = getShift(empIdx, ds);
      if (s !== 'WORK') entries[ds] = s;   // 只記非 WORK（WORK 是預設）
    }
    scheduleByName[emp.name] = entries;
  });

  // prevStreak 轉成 {名字: 天數}
  const streakByName = {};
  emps.forEach((emp, empIdx) => {
    const v = prevStreak[empIdx] || 0;
    if (v > 0) streakByName[emp.name] = v;
  });

  // 每日上班人數快照
  const dailyCount = {};
  for (let d = 1; d <= days; d++) {
    const ds = dateStr(curYear, curMonth, d);
    let count = 0;
    emps.forEach((_, i) => { if (getShift(i, ds) === 'WORK') count++; });
    const req = getDayReq(ds);
    dailyCount[ds] = { count, min: req.min, ideal: req.ideal };
  }

  const payload = {
    month: `${curYear}-${String(curMonth).padStart(2,'0')}`,
    hasAutoRestRun,
    prevStreak: streakByName,
    schedule: scheduleByName,
    dailyCount,
  };

  const text = JSON.stringify(payload, null, 2);
  navigator.clipboard.writeText(text).then(() => {
    showToast('📋 除錯資訊已複製到剪貼板');
  }).catch(() => {
    // fallback：開新視窗顯示
    const w = window.open('', '_blank', 'width=600,height=500');
    w.document.write(`<pre style="font-size:12px;padding:16px">${text}</pre>`);
    showToast('⚠ 無法自動複製，已開新視窗');
  });
}

// ─── Toast ───────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

// ─── LocalStorage 持久化 ──────────────────────────────────

function lsKey(y, m) {
  return `smartShift_${storeId}_${y}_${String(m).padStart(2,'0')}`;
}

function saveData() {
  try {
    const payload = {
      storeId, year: curYear, month: curMonth,
      employees, schedule, prevStreak, hasAutoRestRun,
    };
    localStorage.setItem(lsKey(curYear, curMonth), JSON.stringify(payload));
    pruneOldData();
  } catch(e) {
    console.warn('smartShift: 儲存失敗', e);
  }
}

function loadData() {
  try {
    const raw = localStorage.getItem(lsKey(curYear, curMonth));
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || data.year !== curYear || data.month !== curMonth) return false;

    if (data.employees)  employees  = data.employees;
    // JSON key 會變字串，還原成數字 index
    if (data.schedule) {
      schedule = {};
      Object.keys(data.schedule).forEach(k => { schedule[+k] = data.schedule[k]; });
    }
    if (data.prevStreak) {
      prevStreak = {};
      Object.keys(data.prevStreak).forEach(k => { prevStreak[+k] = data.prevStreak[k]; });
    }
    hasAutoRestRun = data.hasAutoRestRun || false;
    return true;
  } catch(e) {
    console.warn('smartShift: 讀取失敗，使用空班表', e);
    return false;
  }
}

function pruneOldData() {
  try {
    const prefix = `smartShift_${storeId}_`;
    const found = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !k.startsWith(prefix)) continue;
      const m = k.slice(prefix.length).match(/^(\d{4})_(\d{2})$/);
      if (m) found.push({ key: k, ym: parseInt(m[1]) * 100 + parseInt(m[2]) });
    }
    // 最新六個月保留，其餘刪除
    found.sort((a, b) => b.ym - a.ym);
    found.slice(6).forEach(x => localStorage.removeItem(x.key));
  } catch(e) {
    console.warn('smartShift: pruneOldData 失敗', e);
  }
}
